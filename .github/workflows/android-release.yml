
name: Build Signed Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      
      - name: Generate Android project
        working-directory: flutter_app
        run: flutter create --platforms android --project-name personal_ai_agent --org com.ashiwany .

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze code
        working-directory: flutter_app
        run: flutter analyze

      - name: Run tests
        working-directory: flutter_app
        run: flutter test

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > flutter_app/android/app/release-keystore.jks
          chmod 600 flutter_app/android/app/release-keystore.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          content = path.read_text()

          content = (
              'import java.util.Properties\n'
              'import java.io.FileInputStream\n\n'
              + content
          )

          marker = "android {"
          signing = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          content = content.replace(marker, signing + marker, 1)

          content = content.replace(
              "signingConfigs {",
              "signingConfigs {",
              1
          )

          content = content.replace(
              "buildTypes {",
              '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {
              ''',
              1
          )

          content = content.replace(
              "signingConfig = signingConfigs.getByName(\"debug\")",
              "signingConfig = signingConfigs.getByName(\"release\")"
          )

          path.write_text(content)
          PY

          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

          chmod 600 android/key.properties

      - name: Build signed release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-signed-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
