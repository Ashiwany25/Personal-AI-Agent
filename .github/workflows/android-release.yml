
name: Build Signed Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: flutter_app
        run: |
          flutter create \
            --platforms android \
            --project-name personal_ai_agent \
            --org com.ashiwany \
            .

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: flutter_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > flutter_app/android/app/release-keystore.jks

          chmod 600 \
            flutter_app/android/app/release-keystore.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          content = path.read_text()

          imports = (
              "import java.util.Properties\n"
              "import java.io.FileInputStream\n\n"
          )

          content = imports + content

          marker = "android {"
          assert marker in content, "Android block missing"

          signing_properties = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(
              FileInputStream(keystorePropertiesFile)
          )

          '''

          content = content.replace(
              marker,
              signing_properties + marker,
              1
          )

          marker = "    buildTypes {"
          assert marker in content, "Build types block missing"

          signing_config = '''
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String
                      keyPassword =
                          keystoreProperties["keyPassword"] as String
                      storeFile = file(
                          keystoreProperties["storeFile"] as String
                      )
                      storePassword =
                          keystoreProperties["storePassword"] as String
                  }
              }

          '''

          content = content.replace(
              marker,
              signing_config + marker,
              1
          )

          debug_signing = (
              'signingConfig = signingConfigs.getByName("debug")'
          )

          assert debug_signing in content, (
              "Debug signing configuration missing"
          )

          content = content.replace(
              debug_signing,
              'signingConfig = signingConfigs.getByName("release")',
              1
          )

          path.write_text(content)
          PY

          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

          chmod 600 android/key.properties

      - name: Build signed release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Verify release APK exists
        run: |
          test -s \
            flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-signed-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
